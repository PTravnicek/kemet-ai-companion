<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#211914"><meta name="description" content="Tap-first, server-free tabletop companion for original Kemet. Version 2."><title>Kemet · Tabletop II</title><link rel="stylesheet" href="style.css?v=2.0.0"></head><body>
<header class="topbar"><div class="brand">KEMET<small>TABLETOP II · <span id="version">2.0.0</span></small></div><div class="top-actions"><span class="day" id="day">DAY 1</span><button class="icon-btn" data-action="undo" aria-label="Undo last change">↶</button><button class="icon-btn" data-action="game" aria-label="Game menu">☰</button></div></header>
<div id="boot" class="boot">Opening your table…</div><noscript><p>This is an interactive website. Open this page in Safari with JavaScript enabled.</p></noscript>
<main class="tabletop"><div class="table-inner"><section class="opponent" id="ai-mat" aria-label="AI player area"></section><section class="board-surround"><div class="board-label"><span id="board-hint">THE WEST BANK · TAP A TROOP</span><button data-action="zoom" id="zoom">Zoom</button></div><div class="board-scroll" id="board-scroll"><div class="board" id="board"></div></div><footer>Original vector board • use your physical board for movement legality</footer></section><section class="human-area"><div id="human-mat" aria-label="Your player area"></div><div class="hand-title"><span>YOUR BATTLE HAND <b id="hand-count">6</b> / 6</span><button data-action="start-battle">Play a battle →</button></div><div class="hand" id="human-hand"></div></section></div></main>
<nav class="dock" aria-label="Table controls"><button data-action="home" aria-label="Table view"><span>⌂</span>TABLE</button><button data-action="player" data-who="human" aria-label="Your player mat"><span>♟</span>YOUR MAT</button><button data-action="market" aria-label="Power tile catalog"><span>◇</span>POWERS</button><button class="primary" data-action="start-battle" aria-label="Start or resume battle"><span>⚔</span>BATTLE</button></nav>
<div class="backdrop" id="backdrop" data-action="close" hidden></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Game controls" hidden></section><div class="toast" role="status" aria-live="polite" id="toast" hidden></div><input type="file" id="import" accept="application/json,.json" hidden>
<script type="module" src="app.js?v=2.0.0"></script>
</body></html>
