name: V2 browser and live-site tests
on:
  push:
    paths:
      - 'v2/**'
      - 'tests/**'
      - '.github/workflows/v2-tests.yml'
  pull_request:
    paths:
      - 'v2/**'
      - 'tests/**'
      - '.github/workflows/v2-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core rules tests
        run: node --test tests/core.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Chromium and WebKit mobile and desktop interactions
        env:
          BROWSERS: chromium,webkit
        run: |
          python tests/mobile.py
          mv browser-test-results.json local-browser-test-results.json
      - name: Wait for the actual GitHub Pages release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tests/wait-pages.py
      - name: Test the live HTTPS website in WebKit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BROWSERS: webkit
          BASE_URL: https://ptravnicek.github.io/kemet-ai-companion/v2/
        run: python tests/mobile.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-browser-evidence
          path: |
            *browser-test-results.json
            live-deployment.json
            preview-*.png
            battle-*.png
