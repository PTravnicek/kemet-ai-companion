<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211914"><title>Kemet · Tabletop III</title><link rel="stylesheet" href="style.css?v=3.0.0-beta.1"></head><body>
<header class="topbar"><div class="brand">KEMET<small>TABLETOP III · <span id="version">3.0.0-beta.1</span></small></div><div class="top-actions"><button class="icon-btn" data-action="undo" aria-label="Undo last action">↶</button><button class="icon-btn" data-action="game" aria-label="Game menu">☰</button></div></header>
<div id="boot" class="boot">Opening your table…</div><noscript>Open the website in Safari with JavaScript enabled. File previews cannot run this game.</noscript>
<div class="rulebar" id="rulebar"><span id="turn-label"></span><button data-action="coverage" id="mode-label">Rules beta · coverage</button></div>
<main class="tabletop"><div class="table-inner"><section class="opponent" id="ai-mat" aria-label="AI player area"></section><section class="board-surround"><div class="board-label"><span id="board-hint">TAP AN ARMY TO MOVE</span><button data-action="zoom" id="zoom">Zoom</button></div><div class="board-scroll" id="board-scroll"><div class="board" id="board"></div></div><footer>Original-edition west bank · all art built in · east bank out of play</footer></section><section class="human-area" id="human-area"><div id="human-mat"></div><div class="hand-label">YOUR BATTLE HAND <span id="hand-count">6</span></div><div class="hand" id="human-hand"></div></section></div></main>
<div id="movebar" class="movebar" hidden></div><nav class="dock"><button data-action="home">⌂<span>TABLE</span></button><button data-action="actions">◉<span>ACTIONS</span></button><button data-action="market">◇<span>POWERS</span></button><button data-action="ai-turn" id="ai-button">♟<span>AI TURN</span></button></nav>
<button id="backdrop" class="backdrop" data-action="close" hidden aria-label="Dismiss panel"></button><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Game controls" hidden></section><div class="toast" id="toast" role="status" hidden></div><input id="import" type="file" accept=".json,application/json" hidden>
<script type="module" src="app.js?v=3.0.0-beta.1"></script></body></html>
